<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParentTwin — إعداد العائلة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1b2a;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: #1a2a3a;
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: rgba(255,255,255,0.5); margin-bottom: 32px; font-size: 14px; }
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
  input, textarea {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    color: white;
    font-size: 15px;
    font-family: Arial, sans-serif;
    outline: none;
    transition: border 0.2s;
  }
  input:focus, textarea:focus {
    border-color: rgba(102,126,234,0.6);
  }
  textarea { height: 80px; resize: none; }
  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .success {
    display: none;
    text-align: center;
    padding: 20px;
  }
  .success h2 { font-size: 28px; margin-bottom: 8px; }
  .success p { color: rgba(255,255,255,0.6); margin-bottom: 20px; }
  .link-box {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: #a5b4fc;
    word-break: break-all;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .copy-btn {
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    margin-top: 12px;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="card">
  <div id="form-section">
    <h1>👨‍👧 إعداد ParentTwin</h1>
    <p class="subtitle">أدخل معلومات عائلتك لتخصيص التجربة</p>

    <div class="field">
      <label>اسم الوالد/الوالدة</label>
      <input type="text" id="parent_name" placeholder="مثال: محمد أو سارة">
    </div>

    <div class="field">
      <label>اسم الطفل</label>
      <input type="text" id="child_name" placeholder="مثال: يوسف">
    </div>

    <div class="field">
      <label>عمر الطفل (بالسنوات)</label>
      <input type="number" id="child_age" placeholder="مثال: 2" min="0" max="10">
    </div>

    <div class="field">
      <label>اهتمامات الطفل</label>
      <input type="text" id="child_interests" placeholder="مثال: الديناصورات، السيارات، الرسم">
    </div>

    <div class="field">
      <label>أسلوبك مع طفلك</label>
      <textarea id="parent_style" placeholder="مثال: أناديه حبيبي، أحكيله قصص، أستخدم كلمات بسيطة..."></textarea>
    </div>

    <div class="field">
      <label>رقم هاتفك (للطوارئ)</label>
      <input type="tel" id="phone" placeholder="مثال: 966500000000+">
    </div>

    <button class="btn" id="saveBtn" onclick="saveFamily()">
      ✨ إنشاء التوأم الرقمي
    </button>
  </div>

  <div class="success" id="success-section">
    <div style="font-size:64px; margin-bottom:16px;">🎉</div>
    <h2>جاهز!</h2>
    <p>أرسل هذا الرابط للطفل أو المربية</p>
    <div class="link-box" id="child-link"></div>
    <button class="copy-btn" onclick="copyLink()">📋 نسخ الرابط</button>
    <button class="copy-btn" onclick="location.reload()" style="margin-top:8px;">
      ➕ إضافة عائلة أخرى
    </button>
  </div>
</div>

<script>
async function saveFamily() {
  const btn = document.getElementById('saveBtn');
  const data = {
    parent_name: document.getElementById('parent_name').value,
    child_name: document.getElementById('child_name').value,
    child_age: parseInt(document.getElementById('child_age').value),
    child_interests: document.getElementById('child_interests').value,
    parent_style: document.getElementById('parent_style').value,
    phone: document.getElementById('phone').value
  };

  if (!data.parent_name || !data.child_name) {
    alert('يرجى إدخال اسم الوالد والطفل على الأقل');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ جارٍ الحفظ...';

  try {
    const res = await fetch('/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    
    const link = `${window.location.origin}/?family=${result.id}`;
    document.getElementById('child-link').textContent = link;
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = 'block';

  } catch(err) {
    alert('حدث خطأ، حاول مرة ثانية');
    btn.disabled = false;
    btn.textContent = '✨ إنشاء التوأم الرقمي';
  }
}

function copyLink() {
  const link = document.getElementById('child-link').textContent;
  navigator.clipboard.writeText(link);
  const btn = event.target;
  btn.textContent = '✅ تم النسخ!';
  setTimeout(() => btn.textContent = '📋 نسخ الرابط', 2000);
}
</script>
</body>
</html>
